#dispatch-air .study {
  --ink: #fff8e5; --active: #ffe2a0; --line: #f2f0d2;
  --motion: 180ms; --ease: cubic-bezier(.2,.75,.2,1);
  --preview-ink: light-dark(#344b3d, #e2e4d8); --preview-muted: light-dark(#5f7064, #b8c1b1);
  color: var(--preview-ink); width: 100%;
}
#dispatch-air .study * { box-sizing: border-box; }
#dispatch-air .study button { font: inherit; -webkit-tap-highlight-color: transparent; }
#dispatch-air .study-top { min-height: 47px; display: flex; align-items: center; justify-content: space-between; gap: 6px 18px; flex-wrap: wrap; padding: 8px 2px 12px; }
#dispatch-air .study-title { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.4; }
#dispatch-air .study-signature { font-size: 12px; color: var(--preview-muted); }
#dispatch-air .battle { height: 398px; position: relative; isolation: isolate; overflow: hidden; background: #7b9945 var(--battlefield) center / cover no-repeat; }
#dispatch-air .battle::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #17352b; opacity: 0; transition: opacity 160ms ease; }
#dispatch-air .study.shaded .battle::before { opacity: .4; }
#dispatch-air .selector { position: absolute; top: 50%; left: 24px; transform: translateY(-50%); width: 94px; user-select: none; font-variant-numeric: tabular-nums; color: var(--ink); }
#dispatch-air .selector-label { display: block; margin: 0 0 10px 4px; font-size: 12px; line-height: 16px; letter-spacing: .08em; color: #fff8e5; text-shadow: 0 1px 2px #24381cbb, 0 0 1px #24381cbb; }
#dispatch-air .options { display: grid; gap: 11px; }
#dispatch-air .ratio-button { --shape-scale: 1; appearance: none; border: none; background: transparent; padding: 0; width: 94px; height: 54px; position: relative; color: var(--ink); touch-action: manipulation; }
#dispatch-air .number {
  position: absolute; left: 0; top: 0; width: 62px; height: 54px; display: grid; place-items: center;
  font-size: 25px; line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.025em;
  color: inherit; text-shadow: 0 1px 2px #24381c99, 0 0 1px #24381cb3; transition: color var(--motion) ease;
}
#dispatch-air kbd {
  position: absolute; left: 71px; top: 50%; transform: translateY(-50%); color: #f8f5df;
  font: 400 13px/20px "Segoe UI", sans-serif; text-shadow: 0 1px 2px #24381cb3;
  background: transparent; border: 0; padding: 0; box-shadow: none; transition: color var(--motion) ease;
}
#dispatch-air .shape { position: absolute; left: 31px; top: 27px; color: var(--line); opacity: .85; pointer-events: none; filter: drop-shadow(0 1px 1px #263d2270); transition: transform var(--motion) var(--ease), color var(--motion) ease, opacity var(--motion) ease; }
#dispatch-air .ratio-button:hover .shape { opacity: 1; }
#dispatch-air .ratio-button[aria-pressed="true"] { color: var(--active); --shape-scale: 1.03; }
#dispatch-air .ratio-button[aria-pressed="true"] .shape { opacity: 1; color: var(--active); }
#dispatch-air .ratio-button[aria-pressed="true"] kbd { color: var(--active); }
#dispatch-air .ratio-button:active .shape { --shape-scale: .985; }

/* A: a transparent rounded diamond; text stays upright. */
#dispatch-air .diamond .shape { width: 44px; height: 44px; border: 1.4px solid currentColor; border-radius: 6px; transform: translate(-50%, -50%) rotate(45deg) scale(var(--shape-scale)); }
#dispatch-air .diamond [aria-pressed="true"] .shape { border-width: 2px; }
/* B: six thin edges, with no filled polygon or backing. */
#dispatch-air .hexagon .shape { width: 60px; height: 52px; transform: translate(-50%, -50%) scale(var(--shape-scale)); }
#dispatch-air .hexagon .edge { position: absolute; height: 1.4px; background: currentColor; transform-origin: 0 50%; border-radius: 1px; transition: height var(--motion) ease; }
#dispatch-air .hexagon [aria-pressed="true"] .edge { height: 2px; }
#dispatch-air .hexagon .edge:nth-child(1) { left: 14px; top: 1px; width: 32px; }
#dispatch-air .hexagon .edge:nth-child(2) { left: 46px; top: 1px; width: 28.653px; transform: rotate(60.752deg); }
#dispatch-air .hexagon .edge:nth-child(3) { left: 60px; top: 26px; width: 28.653px; transform: rotate(119.248deg); }
#dispatch-air .hexagon .edge:nth-child(4) { left: 14px; top: 51px; width: 32px; }
#dispatch-air .hexagon .edge:nth-child(5) { left: 0; top: 26px; width: 28.653px; transform: rotate(60.752deg); }
#dispatch-air .hexagon .edge:nth-child(6) { left: 14px; top: 1px; width: 28.653px; transform: rotate(119.248deg); }
/* C: open sides and four short corner marks. */
#dispatch-air .corners .shape { width: 53px; height: 49px; transform: translate(-50%, -50%) scale(var(--shape-scale)); }
#dispatch-air .corner { position: absolute; width: 11px; height: 11px; border: solid currentColor; border-width: 0; transition: width var(--motion) var(--ease), height var(--motion) var(--ease); }
#dispatch-air .corner:nth-child(1) { left: 0; top: 0; border-width: 1.4px 0 0 1.4px; border-radius: 3px 0 0 0; }
#dispatch-air .corner:nth-child(2) { right: 0; top: 0; border-width: 1.4px 1.4px 0 0; border-radius: 0 3px 0 0; }
#dispatch-air .corner:nth-child(3) { right: 0; bottom: 0; border-width: 0 1.4px 1.4px 0; border-radius: 0 0 3px 0; }
#dispatch-air .corner:nth-child(4) { left: 0; bottom: 0; border-width: 0 0 1.4px 1.4px; border-radius: 0 0 0 3px; }
#dispatch-air .corners [aria-pressed="true"] .corner { width: 15px; height: 15px; }
#dispatch-air .corners [aria-pressed="true"] .corner:nth-child(1) { border-width: 2px 0 0 2px; }
#dispatch-air .corners [aria-pressed="true"] .corner:nth-child(2) { border-width: 2px 2px 0 0; }
#dispatch-air .corners [aria-pressed="true"] .corner:nth-child(3) { border-width: 0 2px 2px 0; }
#dispatch-air .corners [aria-pressed="true"] .corner:nth-child(4) { border-width: 0 0 2px 2px; }
/* D: one separate short underline per value, without an enclosing frame. */
#dispatch-air .underlines .shape { width: 16px; height: 1.4px; top: 48px; background: currentColor; border-radius: 1px; transform: translateX(-50%); transition: width var(--motion) var(--ease), height var(--motion) ease, color var(--motion) ease, opacity var(--motion) ease; }
#dispatch-air .underlines [aria-pressed="true"] .shape { width: 34px; height: 2px; }
#dispatch-air .study-bottom { min-height: 49px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 2px 4px; }
#dispatch-air .current-value { font-size: 12px; color: var(--preview-muted); }
#dispatch-air output { margin-left: 6px; color: var(--preview-ink); font-variant-numeric: tabular-nums; }
#dispatch-air .demo { appearance: none; border: none; padding: 5px 0 5px 12px; min-height: 32px; background: transparent; color: var(--preview-ink); font-size: 12px; }
#dispatch-air .demo:hover { text-decoration: underline; text-underline-offset: 4px; }
#dispatch-air .reduced-motion * { transition-duration: 0ms !important; }
@media (prefers-reduced-motion: reduce) { #dispatch-air .study * { transition-duration: 0ms !important; } }
@media (max-width: 480px) {
  #dispatch-air .study-top { min-height: 59px; gap: 3px; padding-top: 5px; }
  #dispatch-air .study-signature { width: 100%; }
  #dispatch-air .battle { height: 370px; background-position: 15% center; }
  #dispatch-air .selector { left: 18px; }
}
</style>

<div id="dispatch-air">
  <div class="viz-carousel viz-dotted-background" aria-label="四种独立透明轮廓" data-previous-label="上一方案" data-next-label="下一方案">
    <section data-variant="A · 柔角菱形" aria-label="A 柔角菱形">
      <div class="study diamond" data-design="A">
        <header class="study-top"><h2 class="study-title">A · 柔角菱形</h2><span class="study-signature">细线闭合 · 轻微舒展</span></header>
        <div class="battle"><div class="selector" aria-label="柔角菱形的出兵比例"><span class="selector-label">出兵 %</span><div class="options" role="group" aria-label="出兵比例选项"></div></div></div>
        <footer class="study-bottom"><span class="current-value">当前出兵<output aria-live="polite">50%</output></span><button type="button" class="demo cursor-interaction" aria-pressed="false">播放切换</button></footer>
      </div>
    </section>
    <section data-variant="B · 六角细框" aria-label="B 六角细框" hidden>
      <div class="study hexagon" data-design="B">
        <header class="study-top"><h2 class="study-title">B · 六角细框</h2><span class="study-signature">平直顶边 · 清晰轮廓</span></header>
        <div class="battle"><div class="selector" aria-label="六角细框的出兵比例"><span class="selector-label">出兵 %</span><div class="options" role="group" aria-label="出兵比例选项"></div></div></div>
        <footer class="study-bottom"><span class="current-value">当前出兵<output aria-live="polite">50%</output></span><button type="button" class="demo cursor-interaction" aria-pressed="false">播放切换</button></footer>
      </div>
    </section>
    <section data-variant="C · 四角留白" aria-label="C 四角留白" hidden>
      <div class="study corners" data-design="C">
        <header class="study-top"><h2 class="study-title">C · 四角留白</h2><span class="study-signature">开放轮廓 · 角线伸展</span></header>
        <div class="battle"><div class="selector" aria-label="四角留白的出兵比例"><span class="selector-label">出兵 %</span><div class="options" role="group" aria-label="出兵比例选项"></div></div></div>
        <footer class="study-bottom"><span class="current-value">当前出兵<output aria-live="polite">50%</output></span><button type="button" class="demo cursor-interaction" aria-pressed="false">播放切换</button></footer>
      </div>
    </section>
    <section data-variant="D · 数字短划" aria-label="D 数字短划" hidden>
      <div class="study underlines" data-design="D">
        <header class="study-top"><h2 class="study-title">D · 数字短划</h2><span class="study-signature">数字为主 · 短划展开</span></header>
        <div class="battle"><div class="selector" aria-label="数字短划的出兵比例"><span class="selector-label">出兵 %</span><div class="options" role="group" aria-label="出兵比例选项"></div></div></div>
        <footer class="study-bottom"><span class="current-value">当前出兵<output aria-live="polite">50%</output></span><button type="button" class="demo cursor-interaction" aria-pressed="false">播放切换</button></footer>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  const root = document.getElementById('dispatch-air');
  const variants = [...root.querySelectorAll('[data-variant]')];
  const studies = [...root.querySelectorAll('.study')];
  const validRatios = [25, 50, 75, 100];
  const settings = Object.fromEntries(studies.map(study => [study.dataset.design, { duration: 180, shade: false, reduceMotion: false }]));
  let ratio = 50;
  let demoTimer = null;
  let demoVariant = null;
  let demoIndex = 0;
  const demoRatios = [25, 50, 75, 100, 75, 50];
  for (const study of studies) {
    const outline = study.dataset.design === 'B' ? '<i class="edge"></i>'.repeat(6) : study.dataset.design === 'C' ? '<i class="corner"></i>'.repeat(4) : '';
    const options = study.querySelector('.options');
    for (const value of [100, 75, 50, 25]) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'ratio-button cursor-interaction';
      button.dataset.ratio = String(value);
      button.setAttribute('aria-label', `派遣 ${value}%，快捷键 ${value / 25}`);
      button.innerHTML = `<span class="shape" aria-hidden="true">${outline}</span><span class="number">${value}</span><kbd>[${value / 25}]</kbd>`;
      options.append(button);
    }
  }
  function render() {
    for (const study of studies) {
      const config = settings[study.dataset.design];
      study.style.setProperty('--motion', `${config.duration}ms`);
      study.classList.toggle('shaded', config.shade);
      study.classList.toggle('reduced-motion', config.reduceMotion);
      study.querySelector('output').textContent = `${ratio}%`;
      for (const button of study.querySelectorAll('[data-ratio]')) button.setAttribute('aria-pressed', Number(button.dataset.ratio) === ratio ? 'true' : 'false');
    }
  }
  function restore(saved) {
    const savedRatio = saved?.privateContent?.ratio;
    if (validRatios.includes(savedRatio)) ratio = savedRatio;
    render();
  }
  function save() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent: { preview: '独立透明轮廓四方案', ratio }, privateContent: { ratio } }).catch(() => {});
  }
  function stopDemo() {
    if (demoTimer !== null) window.clearTimeout(demoTimer);
    demoTimer = null; demoVariant = null;
    for (const button of root.querySelectorAll('.demo')) { button.setAttribute('aria-pressed', 'false'); button.textContent = '播放切换'; }
  }
  function select(nextRatio) {
    if (!validRatios.includes(nextRatio) || nextRatio === ratio) return;
    ratio = nextRatio; render();
  }
  function demoStep() {
    if (!demoVariant || demoVariant.hidden) { stopDemo(); return; }
    if (demoIndex === demoRatios.length) { stopDemo(); save(); return; }
    select(demoRatios[demoIndex++]); demoTimer = window.setTimeout(demoStep, 780);
  }
  root.addEventListener('click', event => {
    const ratioButton = event.target.closest('[data-ratio]');
    if (ratioButton) { stopDemo(); select(Number(ratioButton.dataset.ratio)); save(); return; }
    const demoButton = event.target.closest('.demo');
    if (!demoButton) return;
    const wasPlaying = demoButton.getAttribute('aria-pressed') === 'true';
    stopDemo();
    if (wasPlaying) return;
    demoVariant = demoButton.closest('[data-variant]'); demoIndex = 0;
    demoButton.setAttribute('aria-pressed', 'true'); demoButton.textContent = '停止演示'; demoStep();
  });
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.repeat) return;
    if (event.target.closest('input, select, textarea, [contenteditable="true"]')) return;
    const digit = event.code.match(/^(?:Digit|Numpad)([1-4])$/)?.[1] || (/^[1-4]$/.test(event.key) ? event.key : null);
    if (!digit || !variants.some(variant => !variant.hidden)) return;
    event.preventDefault(); stopDemo(); select(Number(digit) * 25); save();
  });
  window.addEventListener('openai:set_globals', event => { if (event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopDemo(); });
  window.addEventListener('pagehide', stopDemo);
  restore(window.openai?.widgetState);
  if (typeof Tweak !== 'undefined') {
    for (const study of studies) {
      const config = settings[study.dataset.design];
      const tweak = new Tweak({ container: study.querySelector('.selector'), onChange: render });
      tweak.addSlider(config, 'duration', { label: '切换时长', min: 120, max: 260, step: 20, unit: 'ms' });
      tweak.addToggle(config, 'shade', { label: '阴影背景对照' });
      tweak.addToggle(config, 'reduceMotion', { label: '减少动态效果' });
    }
  }
})();
</script>
