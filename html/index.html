<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f1df">
    <title>The scenic route — a pelican on a bicycle</title>
    <style>
      * { box-sizing: border-box; }
      html { background: #e8e5db; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: clamp(12px, 3vw, 32px);
        display: grid;
        place-items: center;
      }
      main { width: min(100%, 1000px); }
      img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 18px 60px #263b3520, 0 2px 7px #263b3510;
      }
    </style>
  </head>
  <body>
    <main aria-label="The scenic route, an original vector illustration">
      <img src="pelican-bicycle.svg" width="1000" height="760"
        alt="A cheerful white pelican with an enormous golden bill rides a sea-green bicycle beside the sea. Its red scarf trails in the breeze, and its orange webbed feet work the pedals beneath a warm afternoon sun.">
    </main>
  </body>
</html>
