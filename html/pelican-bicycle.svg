      <stop stop-color="#dcebe1"/>
      <stop offset="1" stop-color="#ecf0dd"/>
    </linearGradient>
    <linearGradient id="feathers" x1="0" y1="0" x2="0.85" y2="1">
      <stop stop-color="#fffdf2"/>
      <stop offset="0.68" stop-color="#f8f5e5"/>
      <stop offset="1" stop-color="#e7e8d7"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.6" y2="1">
      <stop stop-color="#f5c47a"/>
      <stop offset="1" stop-color="#e79759"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffcef"/>
      <stop offset="1" stop-color="#dbe1d0"/>
    </linearGradient>
