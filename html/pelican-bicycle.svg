<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">The scenic route</title>
  <desc id="description">A white pelican with a long golden bill, a coral scarf and orange webbed feet pedals a vintage turquoise bicycle along the coast. Fine spokes, a curved handlebar and a sunny seaside landscape complete the illustration.</desc>
